<ion-header class="se-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tab1" text="Home"></ion-back-button>
    </ion-buttons>
    <ion-title class="font-serif">Bateria</ion-title>
  </ion-toolbar>
  <ion-toolbar class="se-battery-tabs-toolbar">
    <!-- Natywne przyciski zamiast ion-segment: na iOS segment czasem pokazuje tylko aktywny tab. -->
    <div class="se-battery-tabs" role="tablist" aria-label="Sekcje baterii">
      <button
        type="button"
        role="tab"
        class="se-battery-tab"
        *ngFor="let tab of tabs"
        [attr.data-tab]="tab.value"
        [class.se-battery-tab--active]="activeTab === tab.value"
        [attr.aria-selected]="activeTab === tab.value"
        (click)="selectTab(tab.value)"
      >
        {{ tab.label }}
      </button>
    </div>
  </ion-toolbar>
  <ion-toolbar class="se-battery-advice">
    <p class="se-battery-advice__text">
      💡 System doradza — nie steruje. Przycisk odblokujemy po walidacji.
    </p>
  </ion-toolbar>
</ion-header>

<div class="se-battery-outlet">
  <ion-router-outlet></ion-router-outlet>
</div>

<!-- Global Save Footer - only show when there are unsaved changes -->
<ion-footer *ngIf="!stateService.loading() && stateService.hasUnsavedChanges()">
  <ion-toolbar>
    <ion-button
      expand="block"
      (click)="onSave()"
      [disabled]="stateService.saving()"
      color="primary"
    >
      <ion-spinner *ngIf="stateService.saving()" slot="start" name="crescent"></ion-spinner>
      {{ stateService.saving() ? 'Zapisuję...' : 'Zapisz cały plan' }}
    </ion-button>
  </ion-toolbar>
</ion-footer>
