<ion-header class="se-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tab1" text="Home"></ion-back-button>
    </ion-buttons>
    <ion-title class="font-serif">Bateria</ion-title>
  </ion-toolbar>
  <ion-toolbar>
    <ion-segment [(ngModel)]="activeTab" (ionChange)="onTabChange()">
      <ion-segment-button value="settings">
        <ion-label>Ustawienia</ion-label>
      </ion-segment-button>
      <ion-segment-button value="schedule">
        <ion-label>Harmonogram</ion-label>
      </ion-segment-button>
      <ion-segment-button value="analytics">
        <ion-label>Analityka</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
  <ion-toolbar class="se-battery-advise">
    <p class="se-battery-advise__text">
      💡 System doradza — nie steruje. Przycisk odblokujemy po walidacji.
    </p>
  </ion-toolbar>
</ion-header>

<div class="se-battery-outlet">
  <ion-router-outlet></ion-router-outlet>
</div>

<!-- Global Save Footer - only show when there are unsaved changes -->
<ion-footer *ngIf="!stateService.loading() && stateService.hasUnsavedChanges()">
  <ion-toolbar>
    <ion-button 
      expand="block" 
      (click)="onSave()" 
      [disabled]="stateService.saving()"
      color="primary"
    >
      <ion-spinner *ngIf="stateService.saving()" slot="start" name="crescent"></ion-spinner>
      {{ stateService.saving() ? 'Zapisuję...' : 'Zapisz cały plan' }}
    </ion-button>
  </ion-toolbar>
</ion-footer>
