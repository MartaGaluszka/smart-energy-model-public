# CI — pytest na push / PR (Zadanie 18, wariant minimalny: bez Docker registry).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # ręczne „Run workflow” w zakładce Actions

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare SQLite (API + testy jednostkowe)
        run: mkdir -p data

      - name: Pytest
        env:
          DATABASE_PATH: data/energy_model.db
          JWT_SECRET: ci-test-secret-not-for-production
        run: pytest -q --tb=short
